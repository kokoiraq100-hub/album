<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jawla360 - لوحة التحكم</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #111827; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1f2937; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2, h3 { color: #f3f4f6; border-bottom: 2px solid #374151; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #d1d5db; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; background: #374151; border: 1px solid #4b5563; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { background: #ef4444; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #dc2626; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; background: #374151; border-radius: 6px; overflow: hidden; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #4b5563; }
        th { background: #4b5563; }
        a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>💍 Jawla360 - إدارة الألبومات التفاعلية</h2>
        
        <!-- نموذج إضافة عريس جديد -->
        <form action="/create-client" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>اسم العرسان (مثلاً: Ahmed_Fatima):</label>
                <input type="text" name="clientName" required placeholder="اكتب اسم العرسان هنا">
            </div>
            
            <div class="form-group">
                <label>ملف بصمة الألبوم (.mind):</label>
                <input type="file" name="targetFile" accept=".mind" required>
            </div>
            
            <div class="form-group">
                <label>فيديو الكواليس (MP4):</label>
                <input type="file" name="videoFile" accept="video/mp4" required>
            </div>
            
            <button type="submit">إنشاء وتوليد نظام الـ AR للزبون</button>
        </form>

        <hr style="border: 0; border-top: 1px solid #374151; margin: 40px 0;">

        <!-- قسم عرض العرسان السابقين -->
        <h3>📂 قائمة العرسان السابقين المسجلين</h3>
        <table>
            <thead>
                <tr>
                    <th>اسم العرسان</th>
                    <th>رابط الألبوم المباشر</th>
                </tr>
            </thead>
            <tbody id="clientsTable">
                <tr><td colspan="2">جاري التحميل...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // جلب قائمة العرسان السابقين أوتوماتيكياً
        fetch('/api/clients')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('clientsTable');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="2">لا يوجد عرسان مسجلين حالياً.</td></tr>';
                    return;
                }
                tbody.innerHTML = '';
                data.forEach(client => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>\${client.name}</strong></td>
                        <td><a href="\${client.url}" target="_blank">فتح رابط العرض</a></td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                console.error(err);
                document.getElementById('clientsTable').innerHTML = '<tr><td colspan="2">فشل في جلب البيانات.</td></tr>';
            });
    </script>
</body>
</html>
